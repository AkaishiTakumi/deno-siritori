<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しりとり</title>

  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="game-page">

  <main class="page-shell game-shell">

    <h1 class="page-title">しりとり</h1>
    <div id="previous-word" class="previous-word"></div>
    <div class="word-entry">
      <input id="next-word-input" type="text" aria-label="次の単語">
      <button id="next-word-send-button">送信</button>
    </div>
    <button id="reset-send-button" class="secondary-button">リセット</button>

    <div class="qr-panel">
      <div>スマホで遊びたい場合はこちらから</div>
      <img src="/img/qrcode.png" alt="スマホで遊びたい場合はこちらから" width="200">
    </div>

    <div class="error-panel">
      <div id="error-message"></div>
      <div id="error-location"></div>
    </div>
  </main>

  <script type="module" src="./script.ts"></script>

</body>

</html>
