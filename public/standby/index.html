<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待機室</title>

  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="standby-page">

  <main class="page-shell standby-shell">
    <h1 class="page-title">待機室</h1>

    <div class="room-info">
      <div class="info-label">あいことば</div>
      <div id="magic-word" class="magic-word"></div>
    </div>

    <div class="visibility-note">サーバーに公開</div>

    <div id="player-list" class="player-list"></div>

    <div id="number-of-players" class="player-count"></div>

    <button id="start-button" disabled hidden>はじめる</button>

    <div class="qr-panel">
      <div>スマホで遊びたい場合はこちらから</div>
      <img src="/public/img/qrcode_siritori.akaishitakumi.workers.dev.png" alt="スマホで遊びたい場合はこちらから" width="200">
    </div>

    <div class="error-panel">
      <div id="error-message"></div>
      <div id="error-location"></div>
    </div>
  </main>

  <script type="module" src="./script.ts"></script>

</body>

</html>
